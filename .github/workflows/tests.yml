name: tests

on:
  push:
  pull_request:
  workflow_call:   # run by release.yml before publishing

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pytest
        run: uv run --python ${{ matrix.python }} --group dev pytest -q

  web-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: type-check the web UI
        run: npx -y -p typescript@5.6.3 tsc -p revenant_web
